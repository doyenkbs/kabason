<div id="csvToJsonPage">
  <div class="page-head">
    <h2>CSV to JSON</h2>
    <p class="page-desc">Turn a spreadsheet export into JSON you can feed an API, a config file, or a script. Dotted headers rebuild nested objects, and padded IDs like 001 stay strings.</p>
  </div>

  <div class="bench">
    <!-- SOURCE -->
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">CSV</span>
      </div>

      <div class="upload-controls">
        <input type="file" id="csvFile" accept=".csv,text/csv,.txt,text/plain" />

        <select id="delimiterMode" title="Delimiter">
          <option value="auto" selected>Delimiter: auto</option>
          <option value=",">Delimiter: comma</option>
          <option value=";">Delimiter: semicolon</option>
          <option value="\t">Delimiter: tab</option>
          <option value="|">Delimiter: pipe</option>
        </select>

        <select id="headerMode" title="Header row">
          <option value="headers" selected>First row is headers</option>
          <option value="noheaders">No header row</option>
        </select>
      </div>

      <div class="options">
        <label class="csv-opt">
          <input type="checkbox" id="inferTypes" checked />
          Read numbers and booleans as types
        </label>

        <label class="csv-opt">
          <input type="checkbox" id="dotNotation" checked />
          Dotted headers become nested objects
        </label>

        <label class="csv-opt">
          <input type="checkbox" id="trimCells" checked />
          Trim cells
        </label>

        <label class="csv-opt">
          <input type="checkbox" id="skipEmpty" checked />
          Skip empty lines
        </label>
      </div>

      <div class="upload-controls">
        <select id="outputMode" title="Output shape">
          <option value="array" selected>Shape: array of objects</option>
          <option value="keyed">Shape: object keyed by a column</option>
        </select>

        <select id="keyColumn" title="Key column" disabled>
          <option value="">Key column</option>
        </select>

        <select id="indent" title="Indent">
          <option value="2" selected>Indent: 2 spaces</option>
          <option value="4">Indent: 4 spaces</option>
          <option value="0">Minified</option>
        </select>
      </div>

      <textarea id="csvInput" rows="10" spellcheck="false" placeholder="id,name,email&#10;1,Alice,alice@example.com&#10;2,Bob,bob@example.com"></textarea>

      <div class="buttons">
        <button class="btn btn-primary" id="btnConvertCsv">Convert to JSON</button>
        <button class="btn btn-ghost" id="btnClearCsv">Clear</button>
      </div>
    </div>

    <div class="bench-gutter" aria-hidden="true">
      <span class="bench-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </span>
    </div>

    <!-- RESULT -->
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">JSON</span>
      </div>

      <div id="jsonOutput" aria-live="polite" data-empty="Paste CSV and select Convert to JSON."></div>

      <div class="buttons">
        <button class="btn btn-quiet" id="btnCopyJson" disabled>Copy</button>
        <button class="btn btn-quiet" id="btnDownloadJson" disabled>Download</button>
      </div>
    </div>
  </div>

  <p class="tool-footnote">
    <span>Going the other way?</span>
    <button class="btn btn-ghost" id="btnGoJsonToCsv" type="button">Open JSON to CSV</button>
  </p>
</div>
