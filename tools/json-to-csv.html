<div id="jsonToCsvPage">
  <div class="page-head">
    <h2>JSON to CSV</h2>
    <p class="page-desc">Flatten an API response into columns you can open in Excel. Nested keys become dotted column names, and arrays are either joined or split across indexed columns.</p>
  </div>

  <div class="bench">
    <!-- SOURCE -->
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">JSON</span>
      </div>

      <div class="upload-controls">
        <input type="file" id="jsonFile" accept=".json,application/json" />
      </div>

      <div class="upload-controls">
        <input
          type="text"
          id="rootPath"
          placeholder="Root path, such as users or data.items"
          title="If your JSON is an object with an array inside it, enter the path to that array"
        />

        <select id="rootPreset" title="Common root paths">
          <option value="">No root path</option>
          <option value="users">users</option>
          <option value="items">items</option>
          <option value="results">results</option>
          <option value="data">data</option>
          <option value="data.items">data.items</option>
          <option value="data.results">data.results</option>
          <option value="response.items">response.items</option>
        </select>
      </div>

      <div class="upload-controls">
        <select id="arrayMode" title="How to handle arrays inside a record">
          <option value="join" selected>Arrays: join the values</option>
          <option value="index">Arrays: one column per index</option>
        </select>

        <input
          type="text"
          id="arrayJoiner"
          value="; "
          placeholder="; "
          title="Separator used when joining array values"
          aria-label="Array join separator"
        />
      </div>

      <textarea
        id="jsonInput"
        rows="10"
        spellcheck="false"
        placeholder='[{"id":1,"user":{"name":"Chris"},"tags":["a","b"]}]'
      ></textarea>

      <div class="buttons">
        <button class="btn btn-primary" id="btnConvert">Convert to CSV</button>
        <button class="btn btn-ghost" id="btnClear">Clear</button>
      </div>
    </div>

    <div class="bench-gutter" aria-hidden="true">
      <span class="bench-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </span>
    </div>

    <!-- RESULT: check the shape before you take the file -->
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">Table preview</span>
      </div>

      <div class="upload-controls">
        <input type="text" id="tableSearch" placeholder="Filter rows" aria-label="Filter rows" />
      </div>

      <div id="tableWrap" data-empty="Convert some JSON to see the columns it produces."></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <span class="panel-title">CSV</span>
    </div>

    <div id="csvOutput" aria-live="polite" data-empty="The CSV appears here once you convert."></div>

    <div class="buttons">
      <button class="btn btn-quiet" id="btnCopyCsv" disabled>Copy</button>
      <button class="btn btn-quiet" id="btnDownloadCsv" disabled>Download</button>
    </div>
  </div>

  <p class="tool-footnote">
    <span>Going the other way?</span>
    <button class="btn btn-ghost" type="button" data-goto="csvToJsonTool">Open CSV to JSON</button>
  </p>
</div>
