<div class="page-head">
  <h2>List comparison</h2>
  <p class="page-desc">Paste two lists and see what they share and where they differ. Useful for reconciling an inventory export against what a management console reports.</p>
</div>

<!-- Two lists in, three lists out, so the bench runs down the page -->
<div class="bench is-vertical">

  <div>
    <div class="lists">
      <div class="list-section">
        <div class="list-header">
          <h3>List A</h3>
          <span id="listACount" class="list-count" hidden></span>
        </div>
        <textarea id="listA" spellcheck="false" placeholder="One item per line"></textarea>

        <div class="file-row">
          <span class="file-row-label">Or load a CSV or XLSX column</span>
          <input type="file" id="fileA" accept=".csv,.xlsx" />
          <select id="columnA"><option value="">Select column</option></select>
          <span id="fileAInfo" class="hint"></span>
        </div>

        <div class="buttons">
          <button class="btn btn-ghost" id="cleanA">Trim and clean</button>
          <button class="btn btn-ghost" id="clearA">Clear A</button>
        </div>
      </div>

      <div class="list-section">
        <div class="list-header">
          <h3>List B</h3>
          <span id="listBCount" class="list-count" hidden></span>
        </div>
        <textarea id="listB" spellcheck="false" placeholder="One item per line"></textarea>

        <div class="file-row">
          <span class="file-row-label">Or load a CSV or XLSX column</span>
          <input type="file" id="fileB" accept=".csv,.xlsx" />
          <select id="columnB"><option value="">Select column</option></select>
          <span id="fileBInfo" class="hint"></span>
        </div>

        <div class="buttons">
          <button class="btn btn-ghost" id="cleanB">Trim and clean</button>
          <button class="btn btn-ghost" id="clearB">Clear B</button>
        </div>
      </div>
    </div>

    <div class="options">
      <label><input type="checkbox" id="caseInsensitive" checked> Ignore case</label>
      <label><input type="checkbox" id="removeDuplicates" checked> Remove duplicates</label>
      <label><input type="checkbox" id="ignoreBlanks"> Ignore blank lines</label>
      <label><input type="checkbox" id="stripWhitespace"> Strip whitespace</label>
    </div>

    <div class="buttons">
      <button class="btn btn-primary" id="compareBtn">Compare lists</button>
      <button class="btn btn-ghost" id="clearAllBtn">Clear all</button>
    </div>
  </div>

  <div class="bench-gutter" aria-hidden="true">
    <span class="bench-arrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M13 6l6 6-6 6" />
      </svg>
    </span>
  </div>

  <div class="results">
    <div class="result-section">
      <div class="result-head">
        <h3>In both lists</h3>
        <span id="bothCount" class="count"></span>
      </div>
      <div id="bothOutput" class="output" aria-live="polite" data-empty="Nothing compared yet."></div>
      <div class="buttons">
        <button class="btn btn-quiet" data-copy="bothOutput">Copy</button>
        <button class="btn btn-quiet" data-download="bothOutput" data-fn="items_in_both.txt">Download</button>
        <button class="btn btn-ghost" data-clear="bothOutput" data-clearcount="bothCount">Clear</button>
      </div>
    </div>

    <div class="result-section">
      <div class="result-head">
        <h3>Only in list A</h3>
        <span id="onlyACount" class="count"></span>
      </div>
      <div id="onlyAOutput" class="output" aria-live="polite" data-empty="Nothing compared yet."></div>
      <div class="buttons">
        <button class="btn btn-quiet" data-copy="onlyAOutput">Copy</button>
        <button class="btn btn-quiet" data-download="onlyAOutput" data-fn="items_only_in_A.txt">Download</button>
        <button class="btn btn-ghost" data-clear="onlyAOutput" data-clearcount="onlyACount">Clear</button>
      </div>
    </div>

    <div class="result-section">
      <div class="result-head">
        <h3>Only in list B</h3>
        <span id="onlyBCount" class="count"></span>
      </div>
      <div id="onlyBOutput" class="output" aria-live="polite" data-empty="Nothing compared yet."></div>
      <div class="buttons">
        <button class="btn btn-quiet" data-copy="onlyBOutput">Copy</button>
        <button class="btn btn-quiet" data-download="onlyBOutput" data-fn="items_only_in_B.txt">Download</button>
        <button class="btn btn-ghost" data-clear="onlyBOutput" data-clearcount="onlyBCount">Clear</button>
      </div>
    </div>
  </div>

</div>
